    body {

  <div class="nav">
    <a href="/">&larr; home</a>

  <h1>uconnect-emulator</h1>
  
  <div id="readme-content">
    <p style="color: #888;">loading readme from github...</p>
  </div>

<script>
    fetch('https://raw.githubusercontent.com/exycalll/Uconnect-3-8.4-Emulator/main/README.md')
      .then(response => {
        if (!response.ok) throw new Error('failed to load readme, contact oli if this persists !');
        return response.text();
      })
      .then(markdown => {
        document.getElementById('readme-content').innerHTML = marked.parse(markdown);
const container = document.getElementById('readme-content');
        const images = container.getElementsByTagName('img');
        for (let img of images) {
          let src = img.getAttribute('src');
 if (src && !src.startsWith('http') && !src.startsWith('//')) {
            let cleanPath = src.replace(/^\.?\//, '');
            img.src = `https://raw.githubusercontent.com/exycalll/Uconnect-3-8.4-Emulator/main/${cleanPath}`;
          }
        }
      })
      .catch(error => {
        document.getElementById('readme-content').innerHTML = '<p style="color: #ff5555;">failed to load readme from github.</p>';
      });
  </script>

</body>
