      background: #161616;
      padding: 10px;
      text-align: center;
    }

      height: 90px;
      object-fit: contain;
      background: #0a0a0a;
      border: 1px solid #222;
      display: block;
      margin-bottom: 8px;
      cursor: pointer;

      color: #aaa;
      white-space: nowrap;

      text-overflow: ellipsis;

      border: none;
      color: #58a6ff;
      font-family: monospace;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0;
    }

    .btn:hover {

    }

    .modal {

      top: 0;
      left: 0;

      height: 100%;

      justify-content: center;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal.active {

    }

    .modal img {

      border: 1px dashed #444;
      background: #161616;
      padding: 10px;
    }

    .modal-title {
      color: #888;
      margin-top: 15px;
      font-size: 0.9rem;
    }

      color: #58a6ff;
      cursor: pointer;
      font-size: 0.9rem;

function renderGallery() {
      const gallery = document.getElementById('gallery');
      categoryData.assets.forEach((asset) => {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `
          <img src="${asset.src}" alt="${asset.name}" onclick="openModal('${asset.src}', '${asset.name}')">
          <div class="item-name">${asset.name}</div>
          <button class="btn" onclick="openModal('${asset.src}', '${asset.name}')">view</button>
        `;
        gallery.appendChild(item);
      });
    }

    function openModal(src, name) {
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modal-img');
      const modalTitle = document.getElementById('modal-title');
      modalImg.src = src;
      modalTitle.textContent = name;
      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('active');
    }

    document.getElementById('page-title').textContent = categoryData.title;
    document.getElementById('zip-download-link').href = categoryData.zipFile;
    document.getElementById('zip-download-link').textContent = `download ${categoryData.zipFile} ↓`;

    renderGallery();
  </script>
