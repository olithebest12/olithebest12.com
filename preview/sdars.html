    const gallery = document.getElementById('gallery');

    categoryData.assets.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'item';
      card.innerHTML = `
        <img src="${item.src}" alt="${item.name}">
        <div class="item-name" title="${item.name}">${item.name}</div>
        <button class="btn" onclick="openModal(${index})">[ view full ]</button>
      `;
      gallery.appendChild(card);
    });

    function openModal(index) {
      const modal = document.getElementById('modal');
      document.getElementById('modal-img').src = categoryData.assets[index].src;
      document.getElementById('modal-title').textContent = categoryData.assets[index].name;
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
